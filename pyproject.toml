[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpulse-monitor"
version = "0.1.0"
description = "Professional website monitoring CLI and browser dashboard"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1",
    "APScheduler>=3.11"
]


[project.optional-dependencies]
dev = [
    "pytest>=9.2"
]

[project.scripts]
webpulse = "webpulse.cli:main"

[tool.setuptools.packages.find]
include = ["webpulse*"]
